[package]
name = "remote-kernels"
version = "0.2.2"
edition = "2024"
description = "MCP server for spinning up cloud GPU instances and interacting with persistent Jupyter kernels"
license = "MIT"
repository = "https://github.com/Crazytieguy/alignment-hive"
homepage = "https://github.com/Crazytieguy/alignment-hive"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]

default-run = "remote-kernels"

[features]
# In-process test backend: local Jupyter server, local exec/sync, no cloud.
fake-runtime = []

[dependencies]
anyhow = "1.0.101"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.59", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.32"
rand = "0.8"
reqwest = { version = "0.13.2", features = ["json", "query"] }
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
toml = "1.0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }
kube = { version = "4.0.0", features = ["client", "runtime", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
serde_yaml = "0.9.34"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde-inline-default = "1.0.1"
ulid = "1.2.1"
hex = "0.4.3"
shlex = "2.0.1"
sha2 = "0.11.0"

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3.27.0"
