[package]
name = "remote-kernels"
version = "0.3.6"
edition = "2024"
description = "MCP server for spinning up cloud GPU instances and interacting with persistent Jupyter kernels"
license = "MIT"
repository = "https://github.com/Crazytieguy/alignment-hive"
homepage = "https://github.com/Crazytieguy/alignment-hive"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]

default-run = "remote-kernels"

[features]
# In-process test backend: local Jupyter server, local exec/sync, no cloud.
fake-runtime = []

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
kube = { version = "4.2.0", features = ["client", "runtime", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
serde_yaml = "0.9.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde-inline-default = "1.0.3"
ulid = "3.0.0"
hex = "0.4.3"
shlex = "2.0.1"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
tokio-util = "0.7.20"

[dev-dependencies]
dotenvy = "0.15.7"
rmcp = { version = "3.5.1", features = ["client"] }
tempfile = "3.27.0"
