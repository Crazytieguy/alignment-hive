[package]
name = "model-router"
version = "0.1.0"
edition = "2024"
description = "Loopback Anthropic-format gateway routing selected models to a local GPT proxy"
license = "MIT"
repository = "https://github.com/Crazytieguy/alignment-hive"
homepage = "https://github.com/Crazytieguy/alignment-hive"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.8"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.2", features = ["derive"] }
flate2 = "1.1.9"
futures-util = "0.3.32"
reqwest = { version = "0.13.2", features = ["charset", "http2", "rustls", "stream"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.1"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.52.2", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.187"
