[package]
name = "model-router"
version = "0.1.30"
edition = "2024"
description = "Loopback Anthropic-format model routing gateway"
license = "MIT"
repository = "https://github.com/Crazytieguy/alignment-hive"
homepage = "https://github.com/Crazytieguy/alignment-hive"
authors = ["Yoav Tzfati <yoav.tzfati@gmail.com>"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
memchr = "2.8.3"
reqwest = { version = "0.13.5", features = ["charset", "http2", "rustls", "stream"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.3"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
time = "0.3.55"

[dev-dependencies]
serde_yaml = "0.9.34"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
