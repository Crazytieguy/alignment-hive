name: Release hive-cli

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/hive-cli/src/**'
      - 'packages/session-data/src/**'
      - 'packages/ui/src/**'
      - 'packages/review-app/src/**'
      - 'packages/review-app/index.html'
      - 'packages/hive-cli/package.json'

jobs:
  check:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./packages/hive-cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "hive-cli-v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release hive-cli-v${{ steps.version.outputs.version }} already exists, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will_release=hive-cli-v${{ steps.version.outputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64
          - target: darwin-x64
            os: macos-latest
            bun-target: bun-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build review app
        run: bun run --filter '@alignment-hive/review-app' build

      - name: Build binary
        run: |
          bun build --compile --minify --target=${{ matrix.bun-target }} \
            packages/hive-cli/src/cli.ts \
            --outfile dist/hive-cli-${{ matrix.target }}

      - name: Codesign macOS binary
        if: startsWith(matrix.target, 'darwin-')
        run: codesign -f -s - dist/hive-cli-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-cli-${{ matrix.target }}
          path: dist/hive-cli-${{ matrix.target }}

  release:
    name: Create release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAG="hive-cli-v${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/hive-cli-* \
            --title "hive-cli v${VERSION}" \
            --generate-notes
