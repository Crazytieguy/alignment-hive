name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/hive-cli/**'
      - 'packages/session-data/**'
      - 'packages/ui/**'
      - 'packages/review-app/**'
      - 'plugins/debrief/**'
      - 'plugins/hive/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/hive-cli/**'
      - 'packages/session-data/**'
      - 'packages/ui/**'
      - 'packages/review-app/**'
      - 'plugins/debrief/**'
      - 'plugins/hive/**'

jobs:
  check:
    name: Check hive-cli
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run --filter '@alignment-hive/hive-cli' lint

      - name: Test
        run: bun run --filter '@alignment-hive/hive-cli' test

      - name: Lint session-data
        run: bun run --filter '@alignment-hive/session-data' lint

      - name: Test session-data
        run: bun run --filter '@alignment-hive/session-data' test

      - name: Test plugin hooks
        run: bun test plugins/debrief plugins/hive
