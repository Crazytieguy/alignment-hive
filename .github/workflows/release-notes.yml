name: Release Notes

# Posts when a push changes a plugin version. (GitHub's schedule trigger
# started this workflow one to eight hours late.)
on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
  workflow_dispatch:

concurrency: release-notes

jobs:
  post:
    name: Post to Slack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit messages

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: release-notes/state.json
          key: release-notes-state-${{ github.run_id }}
          restore-keys: release-notes-state-

      - name: Post release notes
        run: bun run release-notes/post-to-slack.ts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: release-notes/state.json
          key: release-notes-state-${{ github.run_id }}
