[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# No tag-namespace: tags are package-qualified (remote-kernels-v0.2.1,
# model-router-v0.1.0) and each package's release workflow filters its own.
# The release workflows are hand-maintained (per-package tag filters,
# workflow_dispatch for the auto-tag chain), so dist must not require its
# regenerated CI to match.
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Steps for the build-local-artifacts job. The release workflows are
# hand-maintained, so this only takes effect through their copies of the steps:
# a change to the file needs applying to both by hand.
github-build-setup = "../build-setup.yml"

# Intel macs build on Apple Silicon: same SDK, and `dist build` adds the rustup
# target itself. macos-15-intel took about twice as long as the arm runner.
# The arm target is named too because dist 0.30.3 defaults it to macos-14,
# which GitHub retired on 2026-11-02.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
